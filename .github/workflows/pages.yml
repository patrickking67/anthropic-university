name: Deploy GitHub Pages

# Builds the site data from the canonical JSON and publishes docs/ to GitHub Pages.
# Pages has to be turned on once by the repo owner (Settings > Pages > Source: GitHub Actions).
# The default GITHUB_TOKEN cannot create a Pages site, so until then the probe job reports
# that Pages is off and the build and deploy jobs are skipped instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repo. Skipping deploy."
          fi

  build:
    needs: probe
    if: needs.probe.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Generate web-app data from canonical content
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v6
      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
