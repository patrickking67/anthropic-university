<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="Anthropic University, an unofficial Claude certification study hub">
  <rect x="0" y="0" width="920" height="240" rx="24" fill="#F2EEE6"/>
  <!-- study-card tile -->
  <g transform="translate(40,60) scale(1.875)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="#CC6A4E"/>
    <g fill="none" stroke="#F7F3EC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="17" y="14" width="30" height="22" rx="4" opacity="0.55"/>
      <rect x="13" y="22" width="30" height="22" rx="4" fill="#CC6A4E"/>
      <path d="M22 33l5 5 9-10"/>
    </g>
  </g>
  <!-- wordmark -->
  <text x="200" y="112" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="62" fill="#1F1D1A">Anthropic <tspan fill="#CC6A4E">University</tspan></text>
  <text x="202" y="150" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" letter-spacing="1.5" fill="#5C574E">Unofficial Claude certification practice exams &amp; study guides</text>
  <!-- unofficial pill -->
  <g transform="translate(202,172)">
    <rect x="0" y="0" width="132" height="30" rx="15" fill="none" stroke="#B98A5E" stroke-width="1.5"/>
    <text x="66" y="20" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="2" fill="#8A6A45">UNOFFICIAL</text>
  </g>
</svg>
